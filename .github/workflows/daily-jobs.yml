name: Daily Jobs

# Sends the scheduled notification emails. The old scraper steps and the
# accuracy-tracking pipeline were removed with their features (2026-07 cleanup).

on:
  # Run daily at 2 AM UTC (6 PM PST previous day)
  schedule:
    - cron: '0 2 * * *'

  # Allow manual triggering
  workflow_dispatch:

jobs:
  daily-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Send Scheduled Notifications
        id: send_notifications
        run: |
          echo "📧 Sending scheduled fishing notifications..."

          # Call the notification API endpoint with CRON_SECRET
          curl -X POST "${{ secrets.APP_URL }}/api/notifications/send-scheduled" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -L \
            --fail \
            --show-error \
            --max-time 600

      - name: Create summary
        if: always()
        run: |
          echo "# 📧 Daily Jobs Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.send_notifications.outcome }}" == "success" ]; then
            echo "### ✅ Scheduled Notifications — sent" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Scheduled Notifications — failed" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Daily jobs workflow failed. Check logs for details."
